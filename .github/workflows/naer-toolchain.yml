name: Prepare Android tools for offline build
on:
  push:
    branches: [build/naer-toolchain-20261103]
    paths: [.github/workflows/naer-toolchain.yml]
permissions:
  contents: read
concurrency:
  group: naer-offline-toolchain
  cancel-in-progress: true
jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Official build tools and synthetic dependency probe
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/offline"
          mkdir -p "$BASE/gradle" "$BASE/gradle-home" "$RUNNER_TEMP/probe/app/src/main/java/example/tools" "$RUNNER_TEMP/probe/app/src/test/java/example/tools"
          cd "$BASE/gradle"
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-9.4.1-bin.zip -o gradle.zip
          echo '2ab2958f2a1e51120c326cad6f385153bb11ee93b3c216c5fccebfdfbb7ec6cb  gradle.zip' | sha256sum -c
          unzip -q gradle.zip && rm gradle.zip
          export GRADLE_USER_HOME="$BASE/gradle-home"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;36.0.0'
          cd "$RUNNER_TEMP/probe"
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "OfflineDependencyProbe"
          include(":app")
          EOF
          echo 'plugins { id("com.android.application") version "9.2.0" apply false }' > build.gradle.kts
          printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8\norg.gradle.workers.max=2\n' > gradle.properties
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application") }
          android {
            namespace = "example.tools"
            compileSdk { version = release(37) { minorApiLevel = 0 } }
            defaultConfig { applicationId = "example.tools"; minSdk = 31; targetSdk = 37; versionCode = 1; versionName = "1" }
            compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
            testOptions { unitTests.isIncludeAndroidResources = true }
            lint { abortOnError = false }
          }
          dependencies {
            implementation("androidx.core:core:1.13.0")
            implementation("androidx.recyclerview:recyclerview:1.4.0")
            testImplementation("junit:junit:4.13.2")
            testImplementation("org.robolectric:robolectric:4.17")
          }
          tasks.withType<org.gradle.api.tasks.testing.Test>().configureEach {
            jvmArgs("--add-exports=java.base/jdk.internal.access=ALL-UNNAMED", "--add-opens=java.base/java.io=ALL-UNNAMED")
            maxHeapSize = "1g"
          }
          EOF
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Dependency probe" /></manifest>' > app/src/main/AndroidManifest.xml
          printf 'package example.tools\nobject Probe { fun value() = 1 }\n' > app/src/main/java/example/tools/Probe.kt
          cat > app/src/test/java/example/tools/ProbeTest.kt <<'EOF'
          package example.tools
          import org.junit.Test
          import org.junit.Assert.assertEquals
          import org.junit.runner.RunWith
          import org.robolectric.RobolectricTestRunner
          import org.robolectric.annotation.Config
          import org.robolectric.annotation.GraphicsMode
          @RunWith(RobolectricTestRunner::class)
          @Config(manifest = Config.NONE)
          @GraphicsMode(GraphicsMode.Mode.NATIVE)
          class ProbeTest {
            @Test @Config(sdk = [31]) fun api31() { assertEquals(1, Probe.value()) }
            @Test @Config(sdk = [36]) fun api36() { assertEquals(1, Probe.value()) }
            @Test @Config(sdk = [37]) fun api37() { assertEquals(1, Probe.value()) }
          }
          EOF
          "$BASE/gradle/gradle-9.4.1/bin/gradle" --no-daemon --continue --stacktrace :app:assembleRelease :app:assembleDebug :app:testDebugUnitTest :app:lintRelease
      - name: Package public tools only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/offline"
          mkdir -p "$RUNNER_TEMP/export" "$BASE/android/platforms" "$BASE/android/build-tools" "$BASE/m2"
          cp -a "$ANDROID_HOME/platforms/android-37.0" "$BASE/android/platforms/"
          cp -a "$ANDROID_HOME/build-tools/36.0.0" "$BASE/android/build-tools/"
          cp -a "$ANDROID_HOME/licenses" "$BASE/android/"
          if [ -d "$HOME/.m2/repository" ]; then cp -a "$HOME/.m2/repository" "$BASE/m2/"; fi
          find "$BASE/gradle-home" -name '*.lock' -delete
          rm -rf "$BASE/gradle-home/daemon"
          tar -C "$BASE" -czf "$RUNNER_TEMP/export/toolchain.tar.gz" android gradle gradle-home m2
          cd "$RUNNER_TEMP/export"
          sha256sum toolchain.tar.gz > archive.sha256
          split -b 200M toolchain.tar.gz tools.part
          sha256sum tools.part* > parts.sha256
          ls -lh tools.part*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolchain-aa
          path: |
            ${{ runner.temp }}/export/tools.partaa
            ${{ runner.temp }}/export/*.sha256
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolchain-ab
          path: ${{ runner.temp }}/export/tools.partab
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolchain-ac
          path: ${{ runner.temp }}/export/tools.partac
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolchain-ad
          path: ${{ runner.temp }}/export/tools.partad
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolchain-ae
          path: ${{ runner.temp }}/export/tools.partae
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolchain-af
          path: ${{ runner.temp }}/export/tools.partaf
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolchain-ag
          path: ${{ runner.temp }}/export/tools.partag
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolchain-ah
          path: ${{ runner.temp }}/export/tools.partah
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolchain-ai
          path: ${{ runner.temp }}/export/tools.partai
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolchain-aj
          path: ${{ runner.temp }}/export/tools.partaj
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-probe-reports
          path: ${{ runner.temp }}/probe/app/build/reports
          retention-days: 1
